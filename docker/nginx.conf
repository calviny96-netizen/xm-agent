server {
    listen 80;
    server_name _;
    client_max_body_size 105m;

    location /api/ {
        proxy_pass http://xm-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://xm-ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
