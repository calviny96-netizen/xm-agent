name: xm

services:
  xm-api:
    build: ./api
    container_name: xm-api
    restart: unless-stopped
    env_file:
      - ../PostgreSQL/.env
    environment:
      DATABASE_HOST: postgres-manusai
      QDRANT_URL: http://qdrant-rag:6333
      QDRANT_COLLECTION: xm_rag
      UPLOAD_DIR: /data/uploads
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/xm:/data
      - ./public:/assets:ro

  xm-worker:
    build: ./api
    container_name: xm-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - ../PostgreSQL/.env
    environment:
      DATABASE_HOST: postgres-manusai
      QDRANT_URL: http://qdrant-rag:6333
      QDRANT_COLLECTION: xm_rag
      UPLOAD_DIR: /data/uploads
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/xm:/data
      - ./public:/assets:ro

  xm-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: xm-ui
    restart: unless-stopped
    depends_on:
      - xm-api

  xm-web:
    image: nginx:1.27-alpine
    container_name: xm-web
    restart: unless-stopped
    depends_on:
      - xm-ui
      - xm-api
    ports:
      - 127.0.0.1:9004:80
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  xm-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: xm-hermes
    restart: unless-stopped
    command: gateway run
    depends_on:
      - xm-api
    ports:
      - 127.0.0.1:9002:8642
    volumes:
      - ./data/hermes:/opt/data
      - ./hermes-skills/xm-property-matchmaker:/opt/data/skills/xm-property-matchmaker:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
